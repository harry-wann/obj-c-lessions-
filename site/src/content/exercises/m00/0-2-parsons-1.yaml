id: m00-0-2-parsons-1
chapter: "0.2"
type: parsons
title: 用 XcodeGen 打開 Scratch
minutes: 2
prompt: 在一台剛裝好 Xcode 與 Homebrew 的 Mac 上，把 repo 裡的 Scratch 專案打開。排出正確的指令順序，有些指令不該用。
lines:
  - brew install xcodegen
  - cd xcode/Scratch
  - xcodegen generate
  - open Scratch.xcodeproj
distractors:
  - pod install
  - xcodegen build
  - open project.yml
solution_note: project.yml 是專案的描述檔，`xcodegen generate` 讀它產生 .xcodeproj；.xcodeproj 不進版控，所以每次拉下新結構就重跑一次。`pod install` 是 CocoaPods（模組 11），`xcodegen build` 不存在。
hints: ["先有工具，才能在正確目錄下產生專案。", "產生出來的檔案是 .xcodeproj，不是 .yml。"]
