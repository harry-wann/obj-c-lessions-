id: m00-0-3-predict-1
chapter: "0.3"
type: predict
title: 格式指定子對位
minutes: 2
code: |
  NSInteger count = 12;
  double price = 1280.5;
  NSString *note = @"午餐";
  NSLog(@"%@ %ld 筆 %.2f 元 %d%%", note, (long)count, price, 10);
options:
  - "午餐 12 筆 1280.50 元 10%"
  - "午餐 12 筆 1280.5 元 10%"
  - "午餐 12 筆 1280.50 元 10%%"
  - "午餐 12 筆 1280.50 元 10"
accept: ["午餐 12 筆 1280.50 元 10%"]
feedback:
  "午餐 12 筆 1280.5 元 10%": "%.2f 固定印兩位小數，1280.5 會補成 1280.50。"
  "午餐 12 筆 1280.50 元 10%%": "%% 是「印一個 %」的寫法，輸出只有一個百分號。"
  "午餐 12 筆 1280.50 元 10": "%% 會印出一個 %，不會被吃掉。"
solution_note: 四個引數依序對上 `%@`（物件）、`%ld`（long）、`%.2f`（兩位小數）、`%d`（int）；`%%` 不吃引數，印出一個百分號。
hints: ["%.2f 的 .2 是什麼意思？", "%% 需要引數嗎？"]
