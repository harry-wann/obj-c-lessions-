id: m01-1-1-predict-1
chapter: "1.1"
type: predict
title: 整數除法與餘數
minutes: 2
code: |
  NSInteger total = 7, people = 2;
  NSLog(@"%ld %ld %.1f",
        (long)(total / people), (long)(total % people), total / 2.0);
options: ["3 1 3.5", "3.5 1 3.5", "3 1 3.0", "3 0 3.5"]
accept: ["3 1 3.5"]
feedback: { "3.5 1 3.5": "total / people 兩邊都是整數，結果是 3。", "3 1 3.0": "total / 2.0 有一邊是浮點數，會得到 3.5。", "3 0 3.5": "% 是餘數：7 除 2 餘 1。" }
solution_note: "`/` 兩邊都是整數就是整數除法，`%` 取餘數；只要有一邊是浮點數（2.0）就變成浮點除法。"
hints: ["看每個 / 的兩邊各是什麼型別。", "% 是取餘數，不是百分比。"]
