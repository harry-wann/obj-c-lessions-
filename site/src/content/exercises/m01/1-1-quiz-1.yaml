id: m01-1-1-quiz-1
chapter: "1.1"
section: quiz
type: quiz
title: 整數除法
minutes: 1
prompt: "`NSInteger a = 7 / 2; double b = 7 / 2;` 執行後 a 與 b 分別是多少？"
options: ["3 與 3.5", "3 與 3.0", "3.5 與 3.5", "編譯錯誤：整數不能放進 double"]
answer: 1
explain: 7 和 2 都是整數，`7 / 2` 先算出整數 3；存進 double 只是把 3 變成 3.0，小數早就沒了。要 3.5 得寫 `7 / 2.0` 或 `(double)7 / 2`。
hints: ["兩個運算元的型別決定除法怎麼算，跟結果存哪裡無關。", "C 會自動把整數轉成 double，不會報錯。"]
feedback: { "0": "b 的右邊 7 / 2 和 a 一樣是整數除法，先得到 3 再轉成 double。", "3": "C 允許整數隱含轉成 double，不會報錯，這也是坑的來源。" }
