id: m01-1-3-interview-1
chapter: "1.3"
type: predict
tier: interview
title: 面試題：只出現一次的數
minutes: 3
code: |
  NSInteger ids[] = { 4, 7, 2, 7, 4 };
  NSInteger r = 0;
  for (int i = 0; i < 5; i++) { r ^= ids[i]; }
  NSLog(@"%ld", (long)r);
options: ["2", "0", "24", "7"]
accept: ["2"]
feedback: { "0": "成對的會互相消掉，剩下沒配對的 2。", "24": "^ 是 XOR，不是加法。", "7": "7 出現兩次，7 ^ 7 = 0。" }
solution_note: XOR 的性質：`a ^ a = 0`、`a ^ 0 = a`、順序無關。把陣列全部 XOR 起來，出現兩次的都消成 0，剩下的就是只出現一次的那個。時間 O(n)、空間 O(1)，是位元運算的經典面試題。
hints: ["^ 是 XOR：相同為 0、不同為 1。", "a ^ a 等於什麼？"]
