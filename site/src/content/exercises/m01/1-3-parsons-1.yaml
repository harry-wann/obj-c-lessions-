id: m01-1-3-parsons-1
chapter: "1.3"
type: parsons
title: 排出 NS_OPTIONS 的宣告
minutes: 2
prompt: 把 LBTransactionFlags 的宣告排好。有三行是干擾行。
lines:
  - "typedef NS_OPTIONS(NSUInteger, LBTransactionFlags) {"
  - "    LBTransactionFlagsNone       = 0,"
  - "    LBTransactionFlagsReconciled = 1 << 0,"
  - "    LBTransactionFlagsRecurring  = 1 << 1,"
  - "    LBTransactionFlagsDeleted    = 1 << 2,"
  - "};"
distractors:
  - "typedef NS_ENUM(NSInteger, LBTransactionFlags) {"
  - "    LBTransactionFlagsDeleted    = 3,"
  - "}"
solution_note: 可疊加用 `NS_OPTIONS` + `NSUInteger`；每個旗標是 `1 << n`（1、2、4），3 會和 1 | 2 撞在一起；結尾的 `};` 要有分號。
hints: ["第一個值是 None = 0。", "旗標要彼此不重疊：1、2、4。", "typedef 結尾要分號。"]
