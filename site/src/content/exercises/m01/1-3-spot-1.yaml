id: m01-1-3-spot-1
chapter: "1.3"
type: spot
title: 找出旗標判斷的錯
minutes: 3
prompt: 這段程式能編譯（有一個警告），但 isRecurring 拿到的其實是「已對帳」的狀態。點選有問題的行並選出原因。
code: |
  LBTransactionFlags flags = tx.flags;
  BOOL isReconciled = (flags & LBTransactionFlagsReconciled) != 0;
  BOOL isRecurring = flags & LBTransactionFlagsRecurring != 0;
  BOOL onlyDeleted = flags == LBTransactionFlagsDeleted;
  if (isRecurring) { [self scheduleNext:tx]; }
bug_lines: [3]
reasons:
  - "第 3 行少括號：`!=` 優先於 `&`，實際算的是 flags & (Recurring != 0)，也就是 flags & 1"
  - "第 2 行不該加 != 0，& 的結果直接就是 BOOL"
  - "第 4 行應該用 & 而不是 =="
  - "第 1 行 flags 應該宣告成 NSInteger"
answer_reason: 0
fix: |
  BOOL isRecurring = (flags & LBTransactionFlagsRecurring) != 0;
solution_note: C 的比較運算子優先順序高於位元運算子，`flags & X != 0` 永遠要加括號；clang 的警告「& has lower precedence than !=」就是在講這件事。第 4 行的 `==` 問的是「剛好只有 Deleted」，若需求如此就沒錯。
feedback: { "1": "加 != 0 是好習慣，能保證結果正規化成 0 / 1。", "2": "== 在這裡是「剛好只有這個旗標」，是合法需求；題目說的錯在 isRecurring。", "3": "NS_OPTIONS 的型別就是 LBTransactionFlags（底層 NSUInteger），沒問題。" }
hints: ["比較運算子和 & 誰先算？", "第 3 行和第 2 行差在哪個字元？"]
