id: m03-3-2-quiz-2
chapter: "3.2"
section: quiz
type: quiz
title: 金額為什麼不用 double？
minutes: 1
prompt: 下列關於 `double` 與 `NSDecimalNumber` 的敘述，哪些正確？（可複選）
multi: true
options:
  - "`0.1 + 0.2 == 0.3` 在 double 是 NO"
  - "NSDecimalNumber 用十進位儲存，0.1 可以精確表示"
  - "`[NSDecimalNumber decimalNumberWithDecimal:@(0.1).decimalValue]` 和 `decimalNumberWithString:@\"0.1\"` 一樣精確"
  - "比較兩個 NSDecimalNumber 要用 `compare:`，不用 `==`"
answer: [0, 1, 3]
explain: 0.1 在二進位是無窮循環小數，double 存不準；NSDecimalNumber 以十進位存最多 38 位有效數字。從 double 轉過來的值已經帶著誤差，所以要從字串建立。`==` 比指標。
hints: ["0.1 用二進位能寫成有限小數嗎？", "從 @(0.1) 出發的話，誤差在哪一步就已經發生了？"]
feedback:
  "2": "@(0.1) 先變成 double，誤差已經在裡面了，再轉 NSDecimalNumber 也救不回來。"
