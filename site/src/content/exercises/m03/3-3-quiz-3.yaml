id: m03-3-3-quiz-3
chapter: "3.3"
section: quiz
type: quiz
title: 動態陣列的成本
minutes: 1
prompt: 對一個有 10,000 筆交易的 `NSMutableArray`，下列哪個操作最貴？
options:
  - "`[arr addObject:tx]`（尾端加入）"
  - "`arr[5000]`（取中間一筆）"
  - "`[arr insertObject:tx atIndex:0]`（插到最前面）"
  - "`arr.count`"
answer: 2
explain: 連續記憶體讓取值與 count 都是 O(1)；尾端加入是攤銷 O(1)；插到最前面要把 10,000 筆往後搬一格，O(n)。小帳本因此把新交易加到尾端、顯示時倒序。
hints: ["動態陣列是一塊連續記憶體。", "插入到位置 i 時，後面的元素要怎麼辦？"]
feedback:
  "0": "addObject: 偶爾要擴容搬移，但攤銷下來每次是 O(1)。"
