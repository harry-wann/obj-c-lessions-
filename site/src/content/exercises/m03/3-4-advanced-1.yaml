id: m03-3-4-advanced-1
chapter: "3.4"
type: quiz
tier: advanced
title: 進階：開放定址與負載因子
minutes: 3
prompt: 把 LBHashMap 改成開放定址（線性探測：碰撞就往下一格找空位）。下列哪些敘述正確？（可複選）
multi: true
options:
  - 每個桶最多放一個 entry，所以負載因子不能超過 1，實務上門檻要壓到 0.5–0.7
  - 刪除不能直接把格子清空，否則後面被探測跳過的元素會找不到；要放「墓碑」標記
  - 開放定址的記憶體更連續，對 CPU 快取友善，Apple 的 CFDictionary 用的是這一派
  - 開放定址不需要 isEqual:，只靠 hash 就夠
answer: [0, 1, 2]
explain: 線性探測時查找會沿著格子走直到遇到空格；若刪除直接清空，就切斷了探測路徑，所以要留墓碑（插入時可重用、查找時跳過）。負載因子接近 1 時探測長度急速上升，所以門檻比鏈結法低。isEqual: 仍然必要，hash 相同的不同鍵需要靠它區分。
hints: ["查找時怎麼知道該停下來？刪除一個中間的格子會影響什麼？", "格子只有一個，負載因子最多是多少？"]
feedback:
  "3": "hash 碰撞照樣會發生，沿路探測到的每個格子都要用 isEqual: 確認是不是要找的鍵。"
