id: m03-3-4-quiz-3
chapter: "3.4"
section: quiz
type: quiz
title: hash 與 isEqual: 的合約
minutes: 1
prompt: 下列哪個敘述正確描述了 `hash` / `isEqual:` 的合約？
options:
  - "`isEqual:` 為 YES 的兩個物件，`hash` 必須相同；`hash` 相同的兩個物件不一定 `isEqual:`"
  - "`hash` 相同的兩個物件必須 `isEqual:`"
  - "`hash` 必須在每個物件上唯一，否則字典會出錯"
  - 只有當鍵的類別才需要實作 hash，isEqual: 可以不管
answer: 0
explain: 字典先用 hash 選桶、再用 isEqual: 確認。相等的物件若 hash 不同會落在不同桶，字典宣告找不到。hash 相同只是碰撞，慢一點但正確。
hints: ["字典找值的兩個步驤各用哪個方法？", "碰撞是錯誤還是只是慢？"]
feedback:
  "1": "反過來了。hash 相同只是碰撞，isEqual: 會再確認。"
  "2": "hash 是 NSUInteger，不可能對無限多個物件都唯一；碰撞是正常的。"
