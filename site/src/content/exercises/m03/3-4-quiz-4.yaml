id: m03-3-4-quiz-4
chapter: "3.4"
section: quiz
type: quiz
title: 負載因子
minutes: 1
prompt: 一個鏈結法雜湊表有 8 個桶、放了 6 個元素。負載因子是多少？若門檻是 0.75，接下來會發生什麼？
options:
  - "0.75；再放一個就超過門檻，桶數加倍到 16 並重新計算所有元素的位置"
  - "1.33；已經溢出，要丟例外"
  - "6；桶會自動變成鏈結串列"
  - "0.75；什麼都不會發生，雜湊表容量固定"
answer: 0
explain: 負載因子 = 元素數 ÷ 桶數 = 6 / 8 = 0.75。超過門檻就擴容：桶數加倍、每個元素用新的桶數重新取餘數（rehash）。單次 O(n)，攤銷 O(1)。
hints: ["負載因子的公式是什麼？", "擴容時每個元素的位置為什麼要重算？"]
feedback:
  "3": "固定容量的雜湊表碰撞會越來越多，退化成 O(n)；標準做法是擴容。"
