id: m04-4-1-spot-1
chapter: "4.1"
type: spot
title: 讀舊專案：這段 MRC 程式碼哪裡有問題？
minutes: 3
prompt: 這是一個 `-fno-objc-arc` 檔案裡的方法。點出有問題的行並選原因。
code: |
  - (void)importLunch {
      LBTransaction *tx = [[LBTransaction alloc] initWithNote:@"午餐"];
      [self.ledger addTransaction:tx];
      NSString *title = [NSString stringWithFormat:@"%@ 已加入", tx.note];
      [self.statusLabel setText:title];
      [title release];
  }
bug_lines: [2, 6]
reasons:
  - "tx 用 alloc 拿到卻沒有 release（洩漏）；title 是 +0 的物件卻被 release（多放一次，之後 crash）"
  - "addTransaction: 應該在呼叫前先 retain tx"
  - "stringWithFormat: 回傳的字串必須先 retain 才能設給 label"
  - "setText: 應該改用點語法"
answer_reason: 0
fix: |
  LBTransaction *tx = [[LBTransaction alloc] initWithNote:@"午餐"];
  [self.ledger addTransaction:tx];
  [tx release];                 // 我的那一份放掉，ledger 還持有
  NSString *title = [NSString stringWithFormat:@"%@ 已加入", tx.note];
  [self.statusLabel setText:title];   // title 是 +0，不是我的，不准 release
solution_note: |
  四句話對照：第 2 行 alloc → 我擁有 → 要 release（漏了）；第 4 行 stringWithFormat: 回傳 +0 → 不是我的 → 第 6 行 release 是替別人取消預約，池子排空時會再 release 一次，變成多放。
hints: ["每個 alloc 都要有一個對應的 release。", "stringWithFormat: 開頭是 alloc / new / copy 嗎？"]
feedback:
  "1": "retain 是「接收方」的事，addTransaction: 內部自己會 retain。"
  "2": "setText: 內部會自己 retain / copy，呼叫端不用。"
