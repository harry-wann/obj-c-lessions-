id: m04-4-2-quiz-3
chapter: "4.2"
section: quiz
type: quiz
title: ARC 禁止哪些事？
minutes: 2
prompt: 下列哪些寫法在 ARC 下會直接編譯錯誤？（可複選）
multi: true
options:
  - "`[tx release];`"
  - "`NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];`"
  - "`@autoreleasepool { ... }`"
  - "`[super dealloc];`"
  - "`__weak LBTransaction *w = tx;`"
  - "`void *p = (void *)tx;`"
answer: [0, 1, 3, 5]
explain: ARC 禁止手動 retain / release / autorelease / dealloc、禁止 NSAutoreleasePool 物件（改用 @autoreleasepool 區塊）、禁止 id 與 void * 直接互轉（要用 __bridge，4.5）。`@autoreleasepool` 與 `__weak` 正是 ARC 提供的工具。
hints: ["@autoreleasepool 是 ARC 給你的替代品，不是禁止品。", "id 轉 void * 為什麼要特別說清楚擁有權？"]
feedback:
  "2": "@autoreleasepool { } 是 ARC 下唯一正確的開池方式。"
  "4": "__weak 是 ARC 新增的功能，完全合法。"
