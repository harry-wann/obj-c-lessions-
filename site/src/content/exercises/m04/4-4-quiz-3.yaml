id: m04-4-4-quiz-3
chapter: "4.4"
section: quiz
type: quiz
title: 哪個迴圈該包 @autoreleasepool？
minutes: 1
prompt: 下列哪一段最需要在每一圈包 `@autoreleasepool { }`？
options:
  - "for 迴圈 10 次，每次 `[array addObject:@(i)]`"
  - "for 迴圈 20 萬次，每次用 `NSDateFormatter` 把字串解析成 `NSDate` 並存進陣列"
  - "while 迴圈等待旗標變 YES，每圈 `usleep(1000)`"
  - "for 迴圈 1000 次做整數加總"
answer: 1
explain: 判斷規則：次數多、每圈呼叫會產生 autoreleased 暫存物件的 Foundation API（格式化、解析、字串組合、讀檔）。20 萬次 NSDateFormatter 解析不包池，峰值可能幾百 MB，舊機器會被 Jetsam 殺掉。
hints: ["autoreleased 暫存物件要等 run loop 一圈結束才釋放。", "哪一個選項既次數多、又每圈呼叫 Foundation 的解析 API？"]
feedback:
  "0": "10 次、小整數 NSNumber（tagged pointer）幾乎沒有配置，不需要。"
  "3": "整數運算沒有物件。"
