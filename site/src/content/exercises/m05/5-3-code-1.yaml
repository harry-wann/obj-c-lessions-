id: m05-5-3-code-1
chapter: "5.3"
type: code
title: 宣告 NSArray+LBFunctional 的介面
mobile: false
minutes: 6
prompt: "寫出 `NSArray` 的分類 `LBFunctional` 的 @interface，含三個方法：`lb_map:`（參數是回傳 id 的 block）、`lb_filter:`（參數是回傳 BOOL 的 block）、`lb_reduce:initial:`（reducer block 接 acc 與 obj、回傳 id）。用輕量泛型 `NSArray<ObjectType>`。"
starter: |
  @interface NSArray<ObjectType> (LBFunctional)

  @end
checks:
  - must_match: '@interface NSArray\s*<\s*ObjectType\s*>\s*\(\s*LBFunctional\s*\)'
    message: "要宣告成 @interface NSArray<ObjectType> (LBFunctional)"
  - selector_equals: "lb_map:"
    message: "缺少 lb_map:"
  - selector_equals: "lb_filter:"
    message: "缺少 lb_filter:"
  - selector_equals: "lb_reduce:initial:"
    message: "缺少 lb_reduce:initial:"
  - must_match: 'lb_map\s*:\s*\(\s*id\s*\(\s*\^\s*\)\s*\('
    message: "lb_map: 的參數是回傳 id 的 block：(id (^)(ObjectType obj))"
  - must_match: 'lb_filter\s*:\s*\(\s*BOOL\s*\(\s*\^\s*\)\s*\('
    message: "lb_filter: 的參數是回傳 BOOL 的 block：(BOOL (^)(ObjectType obj))"
  - must_not_match: '-\s*\([^)]*\)\s*(map|filter|reduce)\s*:'
    message: 方法名要加 lb_ 前綴
  - must_match: '@end'
  - brackets_balanced: true
solution: |
  @interface NSArray<ObjectType> (LBFunctional)
  - (NSArray *)lb_map:(id (^)(ObjectType obj))transform;
  - (NSArray<ObjectType> *)lb_filter:(BOOL (^)(ObjectType obj))predicate;
  - (id)lb_reduce:(id (^)(id acc, ObjectType obj))reducer
          initial:(id)initial;
  @end
solution_note: block 參數的語法 `回傳型別 (^)(參數)` 下一章細講，這裡先記形狀。`@implementation` 裡不能寫 ObjectType，要退回 id。
hints: ["分類宣告：@interface 類別 (分類名)。", "block 當參數的寫法是 (回傳型別 (^)(參數型別 參數名))參數名。", "三個方法都要 lb_ 前綴。"]
