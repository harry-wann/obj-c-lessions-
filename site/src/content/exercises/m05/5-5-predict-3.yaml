id: m05-5-5-predict-3
chapter: "5.5"
type: predict
title: 預測輸出：迴圈裡的 block
minutes: 2
code: |
  NSMutableArray *blocks = [NSMutableArray array];
  for (int i = 0; i < 3; i++) {
      [blocks addObject:^{ NSLog(@"%d", i); }];
  }
  for (void (^b)(void) in blocks) b();
options: ["3\n3\n3", "0\n1\n2", "2\n2\n2", "0\n0\n0"]
accept: ["0 1 2"]
feedback:
  "3 3 3": "這是 JS 的 `for (var i...)` 結果。ObjC 每一圈的 block 各自拷貝了當圈的 i。"
  "2 2 2": 值拷貝發生在每個 block 建立的那一刻，不是迴圈結束時。
solution_note: 每圈建立的 block 拷貝了當圈的 i（0、1、2）。這正是 ObjC 值捕獲比 JS 參考捕獲「直覺」的少數場合。
hints: ["每個 block 是在哪一圈建立的？那時 i 是幾？", "JS 的 var 迴圈陷阱在這裡成立嗎？"]
