id: m06-6-2-interview-1
chapter: "6.2"
type: flash
tier: interview
title: 面試題：描述一次方法呼叫的完整流程
minutes: 4
front: |
  面試官：「[ledger addTransaction:tx] 這一行，從執行到真正跑進方法本體，中間發生了什麼？找不到方法呢？」
  請完整回答。
back: |
  1. 編譯成 objc_msgSend(ledger, @selector(addTransaction:), tx)。
  2. 收件人 nil → 直接回 0。
  3. 由 isa 找到類別，查該類別的方法快取（SEL 為鍵的雜湊表）；命中直接跳 IMP。
  4. 未命中：掃自己的方法列表，沒有就到父類別，一路到 NSObject；找到寫進收件人類別的快取。
  5. 都沒有，三段救援：
     - +resolveInstanceMethod: 可用 class_addMethod 當場補實作，回 YES 重查。
     - -forwardingTargetForSelector: 回另一個物件，原訊息重送給它（成本低）。
     - -methodSignatureForSelector: 給簽名，runtime 包成 NSInvocation 交給 -forwardInvocation:（成本高、最彈性，NSProxy 專門做這個）。
  6. 還是沒人接：-doesNotRecognizeSelector: 丟 NSInvalidArgumentException，就是 unrecognized selector sent to instance。

  追問常見：super 走 objc_msgSendSuper，從父類別開始查但 self 不變；Swift 純方法不走這條路，@objc dynamic 才會；為什麼 ObjC 沒有多載（SEL 不含型別）。
