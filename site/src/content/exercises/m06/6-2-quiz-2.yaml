id: m06-6-2-quiz-2
chapter: "6.2"
section: quiz
type: quiz
title: 方法快取是什麼
minutes: 1
prompt: 關於方法快取（method cache），哪一句正確？
options:
  - 每個物件各有一張快取，所以建立越多物件越慢
  - "每個類別一張以 SEL 為鍵的雜湊表，第一次呼叫某方法要走繼承鏈所以慢，找到後寫進快取，之後 O(1)"
  - 快取在編譯期就填好了，所以第一次呼叫跟之後一樣快
  - 快取只存父類別的方法，自己類別的方法不需要快取
answer: 1
explain: 快取掛在類別上，不是物件上。鍵是 SEL（去重過的指標，拿位址當雜湊），值是 IMP。這是 3.4 雜湊表的再現，也是 swizzling 之後 runtime 要清快取的原因。
hints: ["快取掛在哪裡？類別還是物件？", "為什麼說第一次呼叫慢？"]
feedback:
  "0": 快取在類別物件上，所有實體共用。
  "2": 快取是執行期才填的，所以才有「第一次慢」。
