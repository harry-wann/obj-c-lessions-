id: m06-6-4-quiz-1
chapter: "6.4"
section: quiz
type: quiz
title: 哪些修改會觸發 KVO
minutes: 2
prompt: "有人用 KVO 觀察 `ledger` 的 `total`。下面哪些修改會送出通知？（可複選）"
multi: true
options:
  - "self.total = newValue;"
  - "_total = newValue;"
  - "[self setValue:newValue forKey:@\"total\"];"
  - "[self willChangeValueForKey:@\"total\"]; _total = newValue; [self didChangeValueForKey:@\"total\"];"
  - "[_items addObject:tx];（total 是從 _items 算出來的 readonly 屬性，沒有相依鍵）"
answer: [0, 2, 3]
explain: KVO 靠 isa 偷換覆寫 setter 實作，所以走 setter（點語法、setValue:forKey:）會通知；直接改 ivar 不會，除非自己包 willChange / didChange。改內部陣列不會讓衍生屬性發通知，除非宣告相依鍵或手動通知。
hints: ["KVO 的通知是在哪個方法裡夾進去的？", "沒走 setter 要怎麼補？"]
feedback:
  "1": 直接寫 ivar 繞過 setter，KVO 完全不知道。
  "4": total 是算出來的，陣列變了沒人告訴 KVO；要用 keyPathsForValuesAffectingTotal 或手動通知。
