id: m06-6-4-quiz-3
chapter: "6.4"
section: quiz
type: quiz
title: KVC 找不到鍵
minutes: 1
prompt: "`[vc setValue:label forKey:@\"currencyLabel\"]`，但 LBSettingsViewController 沒有 `currencyLabel` 屬性也沒有同名 ivar。會怎樣？"
options:
  - 安靜地忽略
  - 自動新增一個屬性
  - "呼叫 setValue:forUndefinedKey:，預設丟 NSUnknownKeyException：this class is not key value coding-compliant for the key currencyLabel"
  - 編譯錯誤
answer: 2
explain: KVC 的查找順序是 setter → ivar → `setValue:forUndefinedKey:`，最後一步預設丟例外。Storyboard 載入 IBOutlet 就是走 `setValue:forKey:`，所以刪掉屬性沒刪連線就會看到這個訊息。
hints: ["KVC 是執行期用字串找，編譯器不知道。", "Storyboard 的 IBOutlet 是怎麼接上的？"]
feedback:
  "0": 預設行為是丟例外；要忽略得自己覆寫 setValue:forUndefinedKey:。
  "3": 鍵是字串，編譯期不檢查。
