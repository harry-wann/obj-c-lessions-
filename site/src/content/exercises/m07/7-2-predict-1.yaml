id: m07-7-2-predict-1
chapter: "7.2"
type: predict
title: 預測輸出：@try / @catch / @finally 的順序
minutes: 2
code: |
  NSArray *items = @[@"a"];
  @try {
      NSLog(@"1");
      NSLog(@"%@", items[3]);
      NSLog(@"2");
  } @catch (NSException *e) {
      NSLog(@"3 %@", e.name);
  } @finally {
      NSLog(@"4");
  }
  NSLog(@"5");
options: ["1\n2\n4\n5", "1\n3 NSRangeException\n4\n5", "1\n3 NSRangeException\n5", "1\n4"]
accept: ["1 3 NSRangeException 4 5"]
feedback:
  "1 2 4 5": items[3] 越界會 raise NSRangeException，第 2 行不會執行。
  "1 3 NSRangeException 5": "@finally 不管有沒有例外都會執行。"
  "1 4": 接住例外後程式會繼續往下跑，5 會印。
solution_note: 越界 raise → 跳過 2、進 @catch 印 3、@finally 必跑印 4、繼續往下印 5。這段程式只是示範語法；實務上越界是 bug，不該接住。
hints: ["items[3] 會怎樣？", "@finally 什麼時候執行？", "@catch 結束後程式會終止嗎？"]
