id: m07-7-2-quiz-1
chapter: "7.2"
section: quiz
type: quiz
title: 例外還是 NSError
minutes: 2
prompt: 以下哪些狀況在 ObjC 應該用 NSError 回報，而不是丟例外或讓程式 crash？（可複選）
multi: true
options:
  - 使用者輸入的金額字串格式不對
  - 伺服器回 500
  - "`addTransaction:` 被傳進 nil"
  - 要寫入的檔案所在資料夾被使用者刪了
  - 陣列索引越界
answer: [0, 1, 3]
explain: 分界線是「我的程式寫錯」還是「外面的世界不配合」。使用者輸入、網路、檔案系統都是後者，用 NSError；傳 nil 與越界是前者，用斷言在 Debug 攔下。
hints: ["哪些是外面的世界造成的？", "哪些是只要程式寫對就永遠不會發生的？"]
feedback:
  "2": 傳 nil 給不接受 nil 的參數是程式錯誤，用 NSParameterAssert。
  "4": 越界是程式邏輯錯了，Foundation 會 raise NSRangeException，不該接住繼續跑。
