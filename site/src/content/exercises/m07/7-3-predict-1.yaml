id: m07-7-3-predict-1
chapter: "7.3"
type: predict
title: 預測輸出：dispatch_async 到主佇列
minutes: 2
prompt: 這段程式寫在 `viewDidLoad` 裡（主執行緒）。依序會印出什麼？
code: |
  NSLog(@"1");
  dispatch_async(dispatch_get_main_queue(), ^{
      NSLog(@"2");
  });
  NSLog(@"3");
  dispatch_async(dispatch_get_main_queue(), ^{
      NSLog(@"4");
  });
  NSLog(@"5");
options: ["1\n2\n3\n4\n5", "1\n3\n5\n2\n4", "1\n3\n5\n4\n2", "1\n3\n2\n5\n4"]
accept: ["1 3 5 2 4"]
feedback:
  "1 2 3 4 5": dispatch_async 丟了就走，不等 block 執行。block 排在主佇列尾端，要等 viewDidLoad 跑完才輪到。
  "1 3 5 4 2": 主佇列是串列佇列，FIFO：先丟進去的 2 一定先跑。
  "1 3 2 5 4": 現在這段程式也在主佇列上，它沒結束，主佇列不會插隊去跑 2。
solution_note: 主執行緒正在跑 viewDidLoad，主佇列同一時間只能做一件事，所以兩個 block 都排在後面；跑完 1、3、5 之後依 FIFO 執行 2、4。這也是「不確定在哪條執行緒就 dispatch_async(main)」為什麼安全：頂多晚一個 run loop。
hints: ["dispatch_async 會等 block 執行完嗎？", "主佇列是串列還是並行？現在誰占著它？"]
