id: m07-7-3-predict-4
chapter: "7.3"
type: predict
title: 預測輸出：dispatch_group 少了一個 leave
minutes: 3
prompt: 這段程式寫在主執行緒上。依序會印出什麼？
code: |
  dispatch_group_t group = dispatch_group_create();
  dispatch_queue_t main = dispatch_get_main_queue();
  NSLog(@"開始");
  dispatch_group_enter(group);
  dispatch_async(main, ^{
      NSLog(@"USD");
      dispatch_group_leave(group);
  });
  dispatch_group_enter(group);
  dispatch_async(main, ^{
      NSLog(@"JPY");
      // 忘了 dispatch_group_leave
  });
  dispatch_group_notify(group, main, ^{ NSLog(@"全部完成"); });
  NSLog(@"已送出");
options:
  - "開始\n已送出\nUSD\nJPY\n全部完成"
  - "開始\n已送出\nUSD\nJPY"
  - "開始\nUSD\nJPY\n全部完成\n已送出"
  - "開始\n已送出\nUSD\n全部完成\nJPY"
accept: ["開始 已送出 USD JPY"]
feedback:
  "開始 已送出 USD JPY 全部完成": enter 兩次、leave 一次，計數停在 1，notify 永遠不會觸發。
  "開始 USD JPY 全部完成 已送出": 兩個 block 都是 dispatch_async 到主佇列，要等現在這段程式（含「已送出」）跑完才輪到。
  "開始 已送出 USD 全部完成 JPY": notify 要等計數歸零；USD 的 leave 之後計數還是 1。
solution_note: group 是計數器：enter +1、leave −1、歸零才把 notify 的 block 排進佇列。這裡計數停在 1，畫面上的轉圈圈會轉到天荒地老，而且沒有任何錯誤訊息。修法：每條會結束的路徑都要 leave，非同步回呼有 early return 時特別容易漏。
hints: ["enter 幾次、leave 幾次？", "notify 什麼時候才會觸發？", "主佇列上的 block 什麼時候開始跑？"]
