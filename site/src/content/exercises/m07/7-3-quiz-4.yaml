id: m07-7-3-quiz-4
chapter: "7.3"
section: quiz
type: quiz
title: group、semaphore、after 的規則
minutes: 2
prompt: 以下關於 GCD 工具的敘述，哪些正確？（可複選）
multi: true
options:
  - "`dispatch_group_leave` 比 `dispatch_group_enter` 多呼叫一次會 crash"
  - "回呼裡 early return 而漏掉 `dispatch_group_leave`，`dispatch_group_notify` 的 block 永遠不會執行"
  - "`dispatch_group_wait` 在主執行緒上呼叫很安全，畫面會照常更新"
  - "`dispatch_semaphore_create(2)` 代表最多 2 個同時進入"
  - "`dispatch_after` 的時間單位是秒，所以寫 `dispatch_time(DISPATCH_TIME_NOW, 2)` 就是 2 秒"
answer: [0, 1, 3]
explain: group 是計數器，enter / leave 必須配對：少 leave 永遠不歸零，多 leave 直接 crash（Unbalanced call to dispatch_group_leave）。wait 是阻塞的，只能在背景用。dispatch_time 的單位是奈秒，要乘 NSEC_PER_SEC。
hints: ["group 的計數歸零才會觸發 notify。", "wait 這個字代表什麼？", "NSEC_PER_SEC 是拿來做什麼的？"]
feedback:
  "2": wait 會卡住呼叫它的執行緒；卡住主執行緒就是卡住畫面。
  "4": 單位是奈秒，2 奈秒等於立刻。要寫 (int64_t)(2 * NSEC_PER_SEC)。
