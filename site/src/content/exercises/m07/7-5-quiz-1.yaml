id: m07-7-5-quiz-1
chapter: "7.5"
section: quiz
type: quiz
title: atomic 到底保證什麼
minutes: 1
prompt: "`@property (atomic, strong) NSMutableArray *items;` 的 `atomic` 保證的是哪一件事？"
options:
  - "`[self.items addObject:x]` 多執行緒同時呼叫也安全"
  - "單次 getter 或 setter 是完整的：不會拿到一半舊一半新的指標，也不會拿到已被釋放的舊值"
  - "`self.count = self.count + 1` 這種讀改寫不會被插隊"
  - "「先檢查 count 再 removeLastObject」整段不會被打斷"
answer: 1
explain: atomic 只保護「存取屬性那一下」。拿到陣列之後對陣列做的事、讀改寫、先檢查再動作，都是兩次以上的存取，中間都能被插隊。所以實務上屬性幾乎都寫 nonatomic，用佇列或鎖保護整個操作。
hints: ["atomic 保護的是屬性存取，還是屬性指向的物件？", "self.count = self.count + 1 呼叫了幾次存取方法？"]
feedback:
  "0": getter 是原子的，但拿到 NSMutableArray 之後的 addObject: 不在保護範圍，可變集合本身不是執行緒安全的。
  "2": 這是一次 getter 加一次 setter，中間可以被另一條執行緒插隊，兩次加一可能只加了一。
  "3": 檢查與動作是兩步，中間陣列可能已經被清空。
