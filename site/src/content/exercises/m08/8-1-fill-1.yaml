blanks:
  "1": { accept: ["initWithWindowScene"], chips: ["initWithWindowScene", "initWithFrame", "initWithScene", "initWithSession"] }
  "2": { accept: ["rootViewController"], chips: ["rootViewController", "viewController", "contentViewController", "delegate"] }
