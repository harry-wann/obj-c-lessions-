hints: ["視窗要綁到場景，不是 frame。", "整棵畫面樹的根叫什麼？", "誰持有 window？不存就會立刻釋放。", "讓視窗顯示並接收事件的方法名很長。"]
feedback:
  "1=initWithFrame": iOS 13 以後要用場景版初始化器，initWithFrame 建的 window 不會屬於這個場景。
  "3=window": 只賦值給區域變數，方法結束 window 就釋放，螢幕一片黑。
solution_note: "initWithWindowScene: → rootViewController → self.window = window → makeKeyAndVisible。漏第三步是黑畫面最常見的原因。"
