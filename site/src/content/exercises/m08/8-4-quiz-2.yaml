id: m08-8-4-quiz-2
chapter: "8.4"
section: quiz
type: quiz
title: 什麼時候用 reloadData
minutes: 1
prompt: 下列哪個情境**應該**用 `reloadData`，而不是 `deleteRowsAtIndexPaths:` / `insertRowsAtIndexPaths:` 這類局部更新？
options:
  - 滑動刪除一筆交易
  - 從編輯頁新增一筆交易到既有的月份
  - 切換到另一本帳本，整份資料都換掉
  - 改了一筆交易的備註，只有那一列要更新
answer: 2
explain: 資料整批換掉、不知道差了哪幾筆，才用 reloadData；知道差了哪幾筆就用局部更新，有動畫、不會跳回頂端。
hints: ["你知不知道差了哪幾列？", "局部更新的好處是動畫與捲動位置。"]
feedback:
  "0": "刪一筆用 deleteRowsAtIndexPaths:（該月最後一筆用 deleteSections:），有淡出動畫。"
  "1": "知道新的那筆插在哪，用 insertRowsAtIndexPaths:；算不準才退回 reloadData 保平安。"
  "3": "用 reloadRowsAtIndexPaths: 只重畫那一列就好。"
