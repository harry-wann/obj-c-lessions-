id: m08-8-6-crash-1
chapter: "8.6"
type: crash
title: 按「儲存」就 crash
minutes: 2
prompt: 編輯頁一按導覽列的「儲存」就 crash。讀訊息選出原因。
log: |
  *** Terminating app due to uncaught exception 'NSInvalidArgumentException',
  reason: '-[LBTransactionEditorViewController saveTapped:]: unrecognized selector
  sent to instance 0x7fa3c2d1a600'
  *** First throw call stack:
  (
    2  CoreFoundation  -[NSObject(NSObject) doesNotRecognizeSelector:]
    3  CoreFoundation  ___forwarding___
    4  UIKitCore       -[UIApplication sendAction:to:from:forEvent:]
    5  UIKitCore       -[UIBarButtonItem(UIInternal) _sendAction:withEvent:]
  )
options:
  - "action 寫 @selector(saveTapped:)（有冒號），類別裡實作的卻是 - (void)saveTapped（沒冒號），兩者是不同的 selector"
  - 編輯頁的 delegate 是 nil
  - "saveWithError: 回傳 NO 時 UIKit 會丟例外"
  - UIBarButtonItem 被釋放了
answer: 0
fix: |
  // 兩邊冒號數要一致：要嘛都帶 sender
  self.navigationItem.rightBarButtonItem =
      [[UIBarButtonItem alloc] initWithBarButtonSystemItem:UIBarButtonSystemItemSave
                                                    target:self
                                                    action:@selector(saveTapped:)];
  - (void)saveTapped:(UIBarButtonItem *)sender {
      NSError *error = nil;
      if (![self saveWithError:&error]) { /* 顯示錯誤 */ }
  }
  // 要嘛都不帶：@selector(saveTapped) 配 - (void)saveTapped
solution_note: "堆疊裡的 sendAction:to:from:forEvent: 說明這是 target-action：執行期才找方法，編譯期不檢查。開 `GCC_WARN_UNDECLARED_SELECTOR`（-Wundeclared-selector），`@selector` 指到不存在的方法會有警告。另一個變體是 target 寫成別的物件。"
feedback:
  "1": 對 nil delegate 送訊息什麼都不發生，不會 crash。
  "2": "saveWithError: 是你自己寫的方法，回 NO 只是回傳值。"
  "3": 訊息說的是 VC 不認得這個 selector，不是按鈕被釋放（那會是 EXC_BAD_ACCESS）。
hints: ["訊息裡的 selector 結尾有什麼符號？", "對照 action: 那一行與方法宣告。"]
