id: m09-9-4-quiz-3
chapter: "9.4"
section: quiz
type: quiz
title: 不存在 vs 壞掉
minutes: 2
prompt: "`loadLedgerWithError:` 遇到兩種情況：（A）`ledger.json` 不存在；（B）檔案存在但 JSON 解析失敗。各該怎麼處理？"
options:
  - A 與 B 都回空帳本，簡單
  - A 與 B 都回 nil 加 error，由上層決定
  - A 回空帳本、不設 error（第一次啟動是正常狀況）；B 回 nil 加 error，不能靜靜給空帳本，否則下次存檔會覆蓋掉使用者的資料
  - A 回 nil 加 error；B 回空帳本
answer: 2
explain: 「不存在」是正常的第一次啟動；「壞掉」代表使用者的資料還在磁碟上只是讀不出來，回空帳本會在下一次存檔時把它蓋掉。這是資料層最容易犯、代價最高的錯。
hints: ["第一次啟動時檔案存在嗎？", "壞檔回空帳本後，使用者新增一筆交易會發生什麼？"]
feedback:
  "0": B 回空帳本會在下次存檔時覆蓋掉可能救得回來的資料。
  "1": A 是正常狀況，每次第一次啟動都要上層特別處理很煩，也容易被當成錯誤顯示給使用者。
  "3": 剛好反過來。
