hints: ["只建一次的慣用寫法是什麼？", "讓 Render Server 不用算陰影形狀的屬性。", "CALayer 要的是 Core Graphics 型別。"]
feedback:
  "1=dispatch_sync": dispatch_sync 不保證只執行一次。
  "2=mask": mask 本身就會離屏，剛好相反。
solution_note: formatter 用 `dispatch_once` 建一次全 App 共用（iOS 7 起執行緒安全）；`shadowPath` 接 `CGPath`，在 `layoutSubviews` 隨 bounds 更新。
