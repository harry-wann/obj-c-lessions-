id: m10-10-3-quiz-4
chapter: "10.3"
section: quiz
type: quiz
title: 節流 vs 防抖
minutes: 1
prompt: 進度回報「每 100 ms 最多一次」是節流（throttle）還是防抖（debounce）？兩者差在哪？
options:
  - 節流：固定間隔內最多執行一次，期間持續有輸出；防抖是「停下來一段時間後才執行一次」，用在 10.6 的搜尋
  - 防抖：每 100 ms 一次就是防抖
  - 兩個是同義詞
  - 節流是 UI 層的事，防抖是資料層的事
answer: 0
explain: 進度要「持續看到前進」所以用節流；搜尋要「使用者停下來再查」所以用防抖。Kotlin 分別是 sample / debounce。
hints: ["進度條需要在匯入過程中一直更新嗎？", "搜尋框打字時要每個字都查嗎？"]
feedback:
  "1": 防抖是等輸入停止一段時間才觸發；匯入期間輸入不會停，防抖會讓進度條一直不動。
