id: m10-10-4-quiz-4
chapter: "10.4"
section: quiz
type: quiz
title: 哪些工具會處理優先權反轉
minutes: 2
prompt: 高 QoS 執行緒等待低 QoS 執行緒釋放資源時，以下哪些會把優先權借給持有者？（可複選）
multi: true
options:
  - "`os_unfair_lock`"
  - "`dispatch_sync` 到串列佇列"
  - "`dispatch_semaphore_wait`"
  - "`NSLock`"
  - "`dispatch_group_wait`"
answer: [0, 1, 3]
explain: 鎖與 dispatch_sync 知道「誰持有」，可以升級持有者。semaphore 與 group 不知道誰會來 signal / leave，無從升級。
hints: ["系統要升級誰，得先知道誰持有。", "semaphore 的 signal 可以從任何地方來。"]
feedback:
  "2": semaphore 沒有擁有者概念，系統不知道該升級誰。
  "4": group 同理，leave 可能來自任何執行緒。
