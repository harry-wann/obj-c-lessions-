id: m10-10-5-quiz-2
chapter: "10.5"
section: quiz
type: quiz
title: 資料競爭 vs 競態條件
minutes: 2
prompt: 「舊的搜尋結果晚到，覆蓋了新結果」（每次賦值都在主執行緒）屬於哪一種？TSan 抓得到嗎？
options:
  - 競態條件；抓不到，因為每次存取都有同步，只是順序錯了，要靠世代計數之類的設計修
  - 資料競爭；抓得到
  - 兩者都是；抓得到
  - 死結；抓得到
answer: 0
explain: 資料競爭是「未同步地同時存取」，是記憶體層面的問題；競態條件是「結果取決於順序」，是邏輯層面的問題。TSan 只管前者。
hints: ["兩次賦值都在主執行緒，有沒有「同時」？", "TSan 檢查的是什麼？"]
feedback:
  "1": 所有賦值都在主執行緒，沒有未同步的並行存取，不是資料競爭。
