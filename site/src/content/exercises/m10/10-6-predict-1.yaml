id: m10-10-6-predict-1
chapter: "10.6"
type: predict
title: 預測：debounce 後實際搜尋幾次
minutes: 3
prompt: "`debounceInterval` 為 0.25。以下時間點（ms）呼叫 `search:`，每次都用同一個 `LBSearchController`。過濾本身很快可忽略。`results` 會被呼叫幾次、各是哪個字串？"
code: |
  // t =   0 ms  search:@"早"
  // t = 100 ms  search:@"早餐"
  // t = 200 ms  search:@"早餐店"
  // t = 500 ms  search:@"午"
  // t = 600 ms  search:@"午餐"
  // t = 700 ms  （停手）
  [ctl search:q results:^(NSArray *hits, NSString *q) {
      NSLog(@"%@", q);
  }];
options:
  - "2 次：早餐店、午餐"
  - "5 次：早、早餐、早餐店、午、午餐"
  - "1 次：午餐"
  - "3 次：早餐店、午、午餐"
accept: ["2 次：早餐店、午餐", "早餐店 午餐", "2"]
feedback:
  "5 次：早、早餐、早餐店、午、午餐": 那是沒有 debounce 的情況；每次新的 search 都讓前一次的世代作廢。
  "1 次：午餐": 「早餐店」在 200 ms 呼叫，到 450 ms 都沒有新輸入，它會執行；「午」在 500 ms 才來。
  "3 次：早餐店、午、午餐": 「午」在 500 ms、「午餐」在 600 ms，間隔只有 100 ms，「午」醒來時世代已經不是它的。
solution_note: 「早餐店」在 450 ms 醒來，期間沒有新輸入，執行；「午」在 750 ms 醒來時世代已被 600 ms 的「午餐」取代，丟棄；「午餐」在 850 ms 執行。安靜滿 250 ms 才算一次，所以兩段輸入各剩最後一個。testDebounceCoalescesInput 就是這樣斷言回呼次數。
hints: ["每個 search 在幾 ms 醒來？", "醒來時，有沒有比它更新的 search？"]
