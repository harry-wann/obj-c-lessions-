hints: ["以 cost 加總為上限的屬性。", "記憶體警告的通知名稱。", "NSCache 清空的方法。", "第一次用到才建。"]
feedback:
  "1=countLimit": countLimit 限制的是筆數，這裡的數字是位元組。
  "2=UIApplicationWillTerminateNotification": 那是 App 要結束時，不是記憶體警告。
  "4=self.formatter": 在 getter 裡呼叫 self.formatter 會無限遞迴。
solution_note: "totalCostLimit 要搭配 setObject:forKey:cost: 才有意義；兩種限制都只是提示。記憶體警告在主執行緒送達，purge 要快。懶載入 getter 若會被多條執行緒呼叫，改用 dispatch_once。"
