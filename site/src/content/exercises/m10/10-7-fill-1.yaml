blanks:
  "1": { accept: ["totalCostLimit"], chips: ["totalCostLimit", "countLimit", "capacity", "maxSize"] }
  "2": { accept: ["UIApplicationDidReceiveMemoryWarningNotification"], chips: ["UIApplicationDidReceiveMemoryWarningNotification", "UIApplicationWillTerminateNotification", "UIApplicationDidEnterBackgroundNotification", "NSProcessInfoThermalStateDidChangeNotification"] }
  "3": { accept: ["removeAllObjects"], chips: ["removeAllObjects", "removeAll", "clear", "release"] }
