id: m11-11-3-quiz-3
chapter: "11.3"
section: quiz
type: quiz
title: storyboard 合併衝突怎麼處理
minutes: 2
prompt: 兩個人同時改了 Settings.storyboard，git 合併出現衝突。哪些做法是對的？（可複選）
multi: true
options:
  - "<connections> 區塊的衝突：兩邊都保留，再開 IB 檢查有沒有黃色三角形"
  - "<rect> 座標與 toolsVersion 的衝突：取任一邊即可"
  - "用文字編輯器手動合併所有 XML 細節，比 IB 可靠"
  - "之後把 storyboard 用 Refactor to Storyboard 拆成一個流程一檔、一人一檔"
  - "把 .storyboard 加進 .gitignore 避免衝突"
answer: [0, 1, 3]
explain: "連線衝突兩邊都要；座標與版本號取一邊再讓 IB 重排；根本解法是拆檔。手改 XML 比重拉更容易弄壞 id 參考；storyboard 是原始碼，不能不進版控。"
hints: ["哪種衝突會丟掉功能？哪種只是外觀？", "11.3 課文最後一段。"]
feedback:
  "2": "XML 裡的 id 互相參考，手改很容易產生懸空參考；衝突太大寧可放棄一邊重拉。"
  "4": "storyboard 是畫面定義，不進版控專案就跑不起來。"
