id: m11-11-3-spot-1
chapter: "11.3"
type: spot
title: 找錯：destinationViewController 是導覽控制器
minutes: 2
prompt: "編輯頁用 Present Modally 的 segue 開啟，目的地在 storyboard 裡 embed 在 Navigation Controller。執行期 `-[UINavigationController setLedger:]: unrecognized selector`。點出錯的行並選原因。"
code: |
  - (void)prepareForSegue:(UIStoryboardSegue *)segue sender:(id)sender {
      if ([segue.identifier isEqualToString:@"editTransaction"]) {
          LBTransactionEditorViewController *editor = segue.destinationViewController;
          editor.ledger = self.ledger;
          editor.delegate = self;
      }
  }
bug_lines: [3]
reasons:
  - "destinationViewController 是 UINavigationController；要先取它的 topViewController 才是編輯頁"
  - "identifier 應該用 == 比較"
  - "editor.delegate = self 會形成循環參考"
  - "prepareForSegue: 不能設定目的地的屬性，應該在 viewDidLoad 設"
answer_reason: 0
fix: |
  UIViewController *dest = segue.destinationViewController;
  if ([dest isKindOfClass:[UINavigationController class]]) {
      dest = [(UINavigationController *)dest topViewController];
  }
  LBTransactionEditorViewController *editor = (id)dest;
  editor.ledger = self.ledger;
  editor.delegate = self;
solution_note: "`destinationViewController` 回傳 `id`，賦值給任何指標都不會有警告。看到 unrecognized selector 的接收者是 UINavigationController，九成是這個。"
hints: ["crash 訊息說接收者是哪個類別？", "目的地在 storyboard 裡被什麼包著？"]
feedback:
  "1": "字串要用 isEqualToString:，這裡沒錯。"
  "2": "delegate 屬性是 weak，不會循環。"
