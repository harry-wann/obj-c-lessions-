id: m11-11-5-fill-1
chapter: "11.5"
type: fill
title: 補完 Podfile
minutes: 2
prompt: 為小帳本補完 Podfile：iOS 17、主 target 加 Masonry 1.1.x、測試 target 繼承搜尋路徑。
code: |
  platform :ios, '17.0'

  ___1___ 'LittleBook' do
    pod 'Masonry', '___2___'

    target 'LittleBookTests' do
      ___3___ :search_paths
    end
  end
blanks:
  "1": { accept: ["target"], chips: ["target", "project", "workspace", "scheme"] }
  "2": { accept: ["~> 1.1", "~> 1.1.0"], chips: ["~> 1.1", "1.1", ">= 1.1", "latest"] }
  "3": { accept: ["inherit!"], chips: ["inherit!", "use_frameworks!", "import", "include"] }
hints: ["Podfile 以 target 區塊為單位。", "樂觀鎖的符號。", "測試 target 要看得到主 target 的 pod，但不重複連結。"]
feedback:
  "2=>= 1.1": "沒有上限，哪天出 2.0 直接升上去。"
  "2=latest": "不是合法寫法；不寫版本才是「最新」，而且不建議。"
  "3=use_frameworks!": "那是切換動態 framework 的宣告，跟繼承無關。"
solution_note: "`inherit! :search_paths` 讓測試 target 找得到標頭但不重複連結 pod（避免 duplicate symbols）。純 ObjC 專案不加 `use_frameworks!`。"
