id: m11-11-5-quiz-3
chapter: "11.5"
section: quiz
type: quiz
title: 版本鎖定寫法
minutes: 1
prompt: "`pod 'Masonry', '~> 1.1'` 允許哪些版本？"
options:
  - 只有 1.1.0
  - "≥ 1.1 且 < 2.0（1.1.x、1.2、1.9 都可以）"
  - "≥ 1.1 且 < 1.2"
  - 任何版本
answer: 1
explain: "樂觀鎖 `~>` 允許最後一個數字往上長：`~> 1.1` 是 &lt; 2.0；`~> 1.1.0` 才是 &lt; 1.2。跟 npm 的 `^1.1.0` 類似。不寫版本等於「最新」，不要這樣寫。"
hints: ["~> 看的是最後一個數字。", "~> 1.1 跟 ~> 1.1.0 不同。"]
feedback:
  "2": "那是 ~> 1.1.0 的範圍。"
  "0": "精確版本要寫 '1.1.0'，沒有 ~>。"
