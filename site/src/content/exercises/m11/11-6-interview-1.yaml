id: m11-11-6-interview-1
chapter: "11.6"
type: flash
tier: interview
title: "面試題：-ObjC 旗標與 category"
minutes: 3
front: "面試官：靜態庫裡的 category 方法執行期找不到，crash 訊息是 unrecognized selector。原因？怎麼修？-ObjC、-all_load、-force_load 差在哪？"
back: |
  原因：連結靜態庫（.a）時，連結器只拉進「有符號被參考到」的 object file。呼叫 category 方法是 objc_msgSend 送訊息，不會對那個 .o 產生符號參考；一個只含 category 的 .m 編出來的 .o 沒有任何類別符號被參考，整個被丟掉，實作不在執行檔裡。

  修法：主 target 的 Other Linker Flags 加 -ObjC（記得保留 $(inherited)）。它讓連結器把所有含 ObjC 類別或 category 的 .o 全部拉進來。

  三個旗標：
  - -ObjC：拉所有含 ObjC 類別 / category 的 .o。最常用。
  - -all_load：拉所有 .o，不管有沒有 ObjC。暴力，可能 duplicate symbols。
  - -force_load <path>：只對指定的 .a 做 -all_load。-ObjC 無效時（.a 裡只有 category、連一個類別都沒有）用這個。

  為什麼動態 framework 沒這問題：整個 framework 是一個單位載入，不做 dead-strip。CocoaPods 的 xcconfig 會自動加 -ObjC，手動拖進來的 .a 要自己加。
