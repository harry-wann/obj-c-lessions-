id: m11-11-6-xcode-1
chapter: "11.6"
type: xcode
title: LittleBook-Legacy：修完埋雷 3–6，LegacyAudit 六個勾全打
mobile: false
minutes: 45
prompt: 用第一天 SOP 走一遍 LittleBook-Legacy，修掉剩下四處埋雷（斷線 outlet、segue identifier、-ObjC、NSURLConnection dealloc 未取消），把 LegacyAudit.plist 六個 BOOL 全勾 YES。
starter: xcode/M11-starter
steps:
  - "SOP 第 1–2 步：跑起來、列出 target 與 Build Settings。記下 `Other Linker Flags` 目前的值與有 `-fno-objc-arc` 的檔案清單。"
  - "埋雷 3：一啟動就 crash `NSUnknownKeyException ... not key value coding-compliant for the key summaryLabel`。開 `Main.storyboard`，LBLegacyListViewController 的 Connections inspector 找黃色三角形（`summaryLabel`），刪掉、從表頭 label 重拖到現在的屬性 `totalLabel`。"
  - "埋雷 4：點某一列 crash `has no segue with identifier 'showDetial'`。storyboard 的 segue 與 `prepareForSegue:` 都是 `showDetail`，打錯的是 `LBLegacyListViewController.m` 裡 `performSegueWithIdentifier:` 的字串；改正後抽成 `static NSString * const` 常數。"
  - "埋雷 5：列表第一次顯示就 crash `-[__NSCFConstantString lb_trimmed]: unrecognized selector`。App target 的 Other Linker Flags 加 `-ObjC`（保留 `$(inherited)`）：改 `project.yml` 的 `OTHER_LDFLAGS` 後重新 `xcodegen generate`（有用 Pods 再 `pod install`）。"
  - "埋雷 6：進明細頁後立刻按返回，網路慢時（Network Link Conditioner 選 3G）幾秒後 crash：`-[LBLegacyDetailViewController rateService:didLoadRates:]: message sent to deallocated instance`（需開 Zombie Objects）。在 `LBLegacyDetailViewController` 的 `dealloc` 加 `_rateService.delegate = nil; [_rateService cancel];`，`LBLegacyRateService` 的 `dealloc` 也補 `[_connection cancel]`（若 11.2 已改成 NSURLSession，則 cancel 對應的 task）。開 Zombie Objects 再來回 20 次。"
  - "打開 `LittleBook-Legacy/LegacyAudit.plist` 與主線專案的 `LittleBookTests/LegacyAudit.plist`，六個 key（`fixedOverRelease`、`fixedSetterLeak`、`fixedBrokenOutlet`、`fixedSegueIdentifier`、`addedObjCLinkerFlag`、`cancelsConnectionInDealloc`）全部設 YES。⌘U 跑 `LBLegacyAuditTests/testLegacyChecklistComplete`。"
  - "每個埋雷一個 commit；最後補 `docs/ONBOARDING.md`（SOP 第 9 步）。"
tests:
  - LBLegacyAuditTests/testLegacyChecklistComplete
acceptance:
  - "Zombie Objects 開啟、Network Link Conditioner 選 3G，列表 ↔ 明細來回 20 次不 crash"
  - "啟動 log 無 unrecognized selector"
  - "git log 六個獨立 commit，每個訊息說明修的是哪個埋雷"
  - "ONBOARDING.md 列出 target 表、Singleton 清單、通知清單、-fno-objc-arc 檔案清單"
  - "面試能口頭解釋 -ObjC 與 category 的關係、xcworkspace 與 xcodeproj 的差別"
solution_note: "testLegacyChecklistComplete 只是讀 plist 的六個 BOOL；它存在的目的是逼你**做完才勾**，而非真的驗證。六個雷涵蓋本模組的六章：MRC（1、2）、Storyboard（3、4）、連結（5）、淘汰 API 的生命週期（6）。"
