id: m11-11-7-quiz-3
chapter: "11.7"
section: quiz
type: quiz
title: 什麼時候不要重構
minutes: 2
prompt: 以下哪些情況**不該**重構？（可複選）
multi: true
options:
  - "穩定跑五年的 MRC 檔案，沒有測試，半年內不會再碰"
  - "三個月後要下架的模組"
  - "行為沒人說得清、特徵測試也釘不住"
  - "每週都要改、每次改都踩雷的 VC，有特徵測試保護"
  - "為了把 objectForKey: 全換成字面值語法，開一個洗整個專案的 PR"
answer: [0, 1, 2, 4]
explain: "判斷句：這次重構省下的，是不是下一次改這段程式碼時會花掉的時間？選項 D 是**該**重構的典型（常改、常壞、有保護）。E 純風格洗版汙染 blame。"
hints: ["重構的投資什麼時候回收？", "有保護又常改的程式碼是什麼情況？"]
feedback:
  "3": "這正是最該重構的：成本會在下一次修改時回收，而且有測試保護。"
