id: m11-11-7-spot-1
chapter: "11.7"
type: spot
title: 找錯：為了消警告全標 nullable
minutes: 2
prompt: 有人為了讓 nullability 警告消失，把標頭改成這樣。Swift 端抱怨每行都要 guard let。點出有問題的行並選原因。
code: |
  NS_ASSUME_NONNULL_BEGIN
  @interface LBLedger : NSObject
  - (nullable NSArray<LBTransaction *> *)transactions;
  - (void)addTransaction:(nullable LBTransaction *)transaction;
  - (nullable LBTransaction *)transactionWithIdentifier:(NSString *)identifier;
  @end
  NS_ASSUME_NONNULL_END
bug_lines: [3, 4]
reasons:
  - "transactions 實作永遠回傳非 nil 陣列（空陣列而非 nil），addTransaction: 傳 nil 會 crash；兩者標 nullable 是假承諾，Swift 端白白多出 Optional 卻沒更安全"
  - "NS_ASSUME_NONNULL_BEGIN 跟 nullable 不能同時用"
  - "transactionWithIdentifier: 不該是 nullable"
  - "property 不能標 nullability"
answer_reason: 0
fix: |
  NS_ASSUME_NONNULL_BEGIN
  @interface LBLedger : NSObject
  - (NSArray<LBTransaction *> *)transactions;          // 回空陣列，nonnull
  - (void)addTransaction:(LBTransaction *)transaction;  // nil 進來編譯器警告
  - (nullable LBTransaction *)transactionWithIdentifier:(NSString *)identifier;
  @end
  NS_ASSUME_NONNULL_END
solution_note: "標注是承諾：`nonnull` 承諾實作不回 nil，`nullable` 承諾呼叫端會處理。全部 nullable 等於不承諾任何事。警告是用來找 bug 的，不是用來消的。"
hints: ["每個 nullable 問：實作真的會回 nil 嗎？參數真的能處理 nil 嗎？", "Swift 端的 ? 滿天飛表示什麼？"]
feedback:
  "2": "找不到時回 nil 是事實，nullable 是正確的。"
  "1": "BEGIN / END 設預設值，個別 nullable 覆寫，這正是標準用法。"
