hints: ["改名字的、藏起來的、禁用的，各一個巨集。", "REFINED 之後 Swift 端的名字前面多了什麼？"]
feedback:
  "3=amountsAsNumbers": NS_REFINED_FOR_SWIFT 會在 Swift 端名字前加兩條底線，原名不存在。
  "4=NS_UNAVAILABLE": NS_UNAVAILABLE 是對 ObjC 與 Swift 都禁用；只禁 Swift 用 NS_SWIFT_UNAVAILABLE。
solution_note: "`NS_SWIFT_NAME` 改名（工廠方法 → init）、`NS_REFINED_FOR_SWIFT` 加雙底線藏起來、`NS_SWIFT_UNAVAILABLE` 附訊息禁用。"
