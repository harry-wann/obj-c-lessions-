prompt: 補完一個等 completion block 回到主執行緒的測試。
code: |
  - (void)testCompletionCalledOnMainQueue {
      XCTestExpectation *done = [self ___1___:@"rates fetched"];
      [self.service fetchRatesForBase:@"TWD" completion:^(NSDictionary *rates, NSError *error) {
          XCTAssertTrue([NSThread isMainThread]);
          XCTAssertNil(error);
          [done ___2___];
      }];
      [self ___3___:@[done] timeout:1.0];
